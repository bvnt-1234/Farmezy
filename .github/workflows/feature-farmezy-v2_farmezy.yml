# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - farmezy

on:
  push:
    branches:
      - 'feature/farmezy-v2'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Build frontend
        run: |
          npm --prefix frontend install
          npm --prefix frontend run build
          rm -rf frontend/node_modules

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2BAFD244865D47D1B9336F6D7ADEE85C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F6D5C7009A304CA488F48800716FC2D8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2C488E9CF5C04AFAB9EBBFC52A4BB30E }}

      - name: Configure Azure App Service
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config set --name farmezy --resource-group farmezy-rg --startup-file "node server.js"
            az webapp config appsettings set --name farmezy --resource-group farmezy-rg --settings PORT=8080 WEBSITES_PORT=8080 SCM_DO_BUILD_DURING_DEPLOYMENT=false

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'farmezy'
          slot-name: 'Production'
          package: .
          startup-command: 'node server.js'

      - name: Restart Azure Web App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp restart --name farmezy --resource-group farmezy-rg
